name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  release:
    # windows-latest to match build.yml, though only Console is published here
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TheManager.slnx

      - name: Build
        run: dotnet build TheManager.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TheManager.Tests --configuration Release --no-build

      # A tag push (v1.2.3) already names the version explicitly. A push to
      # main instead reads Directory.Build.props — bump <Version> there to
      # cut a new release; pushing to main without bumping it just builds
      # and tests, no release.
      - name: Determine release tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tagName = "${{ github.ref_name }}"
          } else {
            [xml]$props = Get-Content Directory.Build.props
            $version = $props.Project.PropertyGroup.Version
            $tagName = "v$version"
          }
          echo "name=$tagName" >> $env:GITHUB_OUTPUT

          $exists = git ls-remote --tags origin "refs/tags/$tagName"
          if ($exists) {
            Write-Host "Tag $tagName already exists — skipping release."
            echo "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "skip=false" >> $env:GITHUB_OUTPUT
          }

      # Mirrors TheManager.Console/Properties/PublishProfiles/FolderProfile.pubxml
      # (the local single-exe publish profile) rather than that file directly,
      # since its PublishDir is a hardcoded local path.
      - name: Publish Console
        if: steps.tag.outputs.skip == 'false'
        run: >
          dotnet publish TheManager.Console -c Release
          -r win-x86 --self-contained true
          -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:PublishTrimmed=false
          -o publish/console

      - name: Zip Console build
        if: steps.tag.outputs.skip == 'false'
        run: Compress-Archive -Path publish/console/TheManager.exe -DestinationPath TheManager-${{ steps.tag.outputs.name }}.zip

      - name: Create GitHub Release
        if: steps.tag.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: TheManager-${{ steps.tag.outputs.name }}.zip
          generate_release_notes: true
